<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CS-433 Machine Learning — Notes</title>
<meta name="description" content="Lecture notes of the fall 2023 edition of the CS-433 Machine Learning course at EPFL.">
<!-- Generated by scripts/build.mjs from notes/*.md — edit those, not this file. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<style>
:root {
  --bg: #ffffff;
  --fg: #1f1f1f;
  --muted: #6b6b6b;
  --border: #e6e6e6;
  --surface: #f6f6f5;
  /* Notion text colors */
  --c-gray: #787774; --c-brown: #9f6b53; --c-orange: #d9730d; --c-yellow: #b8841f;
  --c-teal: #448361; --c-blue: #337ea9; --c-purple: #9065b0; --c-pink: #c14c8a; --c-red: #d44c47;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161616;
    --fg: #e8e8e6;
    --muted: #9b9b98;
    --border: #2e2e2e;
    --surface: #202020;
    --c-gray: #9b9b9b; --c-brown: #b38b77; --c-orange: #ffa344; --c-yellow: #ffdc49;
    --c-teal: #4dab9a; --c-blue: #529cca; --c-purple: #a883e0; --c-pink: #e255a1; --c-red: #ef6b68;
  }
}

* { box-sizing: border-box; }
html { scroll-padding-top: 1.5rem; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 16px/1.65 Geist, system-ui, -apple-system, sans-serif;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; }
.num { font-family: "Geist Mono", ui-monospace, monospace; color: var(--muted); }

.layout {
  display: grid;
  grid-template-columns: 1fr;
  max-width: 1180px;
  margin: 0 auto;
  padding: 0 16px;
}
@media (min-width: 1000px) {
  .layout { grid-template-columns: 260px minmax(0, 1fr); gap: 56px; padding: 0 32px; }
  nav.toc { position: sticky; top: 0; height: 100vh; overflow-y: auto; padding: 2.5rem 0; }
  nav.toc summary { pointer-events: none; list-style: none; }
  nav.toc summary::-webkit-details-marker { display: none; }
}

nav.toc { font-size: 14px; padding: 1.5rem 0 0; }
nav.toc summary { font-weight: 600; cursor: pointer; margin-bottom: .5rem; }
nav.toc ol { list-style: none; margin: 0; padding: 0; }
nav.toc a {
  display: flex; gap: .6rem;
  padding: .28rem .5rem; margin: 0 -.5rem;
  border-radius: 6px;
  text-decoration: none; color: var(--muted);
}
nav.toc a:hover { background: var(--surface); color: var(--fg); }
nav.toc a.active { color: var(--fg); background: var(--surface); }
nav.toc .num { min-width: 1.4em; text-align: right; }

main { min-width: 0; max-width: 760px; padding: 2.5rem 0 6rem; }
header h1 { font-size: 2.2rem; line-height: 1.15; letter-spacing: -0.02em; margin: 0 0 .5rem; font-weight: 600; }
header p { color: var(--muted); margin: 0; }

.chapter { border-top: 1px solid var(--border); margin-top: 3rem; padding-top: 1rem; }
.chapter h2 { font-size: 1.6rem; letter-spacing: -0.015em; line-height: 1.25; font-weight: 600; margin: 1rem 0 1rem; }
.chapter h2 .num { font-size: 1rem; font-weight: 400; margin-right: .75rem; vertical-align: .15em; }
.chapter h3 { font-size: 1.2rem; font-weight: 600; margin: 2rem 0 .5rem; }
.chapter p { margin: .75rem 0; }
.chapter ul, .chapter ol { padding-left: 1.4rem; margin: .5rem 0; }
.chapter li { margin: .2rem 0; }
.chapter li > ul, .chapter li > ol { margin: .2rem 0; }
.chapter code { font-family: "Geist Mono", ui-monospace, monospace; font-size: .9em; background: var(--surface); padding: .1em .35em; border-radius: 4px; }
.chapter img { display: block; max-width: 100%; height: auto; margin: 1.25rem auto; border-radius: 6px; background: #fff; }
.chapter table { border-collapse: collapse; margin: 1.25rem 0; display: block; overflow-x: auto; font-size: .95rem; }
.chapter th, .chapter td { border: 1px solid var(--border); padding: .5rem .75rem; text-align: left; vertical-align: top; }
.chapter th { background: var(--surface); font-weight: 600; }

.math.display { overflow-x: auto; overflow-y: hidden; margin: 1rem 0; padding: .25rem 0; }
.katex { font-size: 1.05em; }

.c-gray { color: var(--c-gray); } .c-brown { color: var(--c-brown); } .c-orange { color: var(--c-orange); }
.c-yellow { color: var(--c-yellow); } .c-teal { color: var(--c-teal); } .c-blue { color: var(--c-blue); }
.c-purple { color: var(--c-purple); } .c-pink { color: var(--c-pink); } .c-red { color: var(--c-red); }
</style>
</head>
<body>
<div class="layout">
<nav class="toc">
<details id="toc" open>
<summary>Contents</summary>
<ol>
{{toc}}
</ol>
</details>
</nav>
<main>
<header>
<h1>CS-433 Machine Learning</h1>
<p>Lecture notes of the fall 2023 edition of the CS-433 Machine Learning course at EPFL.</p>
</header>

{{content}}
</main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script>
for (const el of document.querySelectorAll(".math")) {
  katex.render(el.textContent, el, { displayMode: el.classList.contains("display"), throwOnError: false });
}

// Collapse the contents list on small screens; highlight the current chapter.
if (matchMedia("(max-width: 999px)").matches) document.getElementById("toc").open = false;
const links = new Map([...document.querySelectorAll("nav.toc a")].map((a) => [a.hash.slice(1), a]));
const observer = new IntersectionObserver((entries) => {
  for (const e of entries) {
    if (!e.isIntersecting) continue;
    links.forEach((a) => a.classList.remove("active"));
    links.get(e.target.querySelector("h2").id)?.classList.add("active");
  }
}, { rootMargin: "0px 0px -80% 0px" });
document.querySelectorAll(".chapter").forEach((s) => observer.observe(s));
</script>
</body>
</html>
